services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friday
    ports:
      - "5432:5432"
    volumes:
      - friday_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - friday_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  friday_pg_data:
  friday_redis_data:
